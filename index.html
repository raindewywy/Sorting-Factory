<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorting Factory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans+Thai:wght@400;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  :root {
    --bg:#16130f; --panel:#1f1b16; --stage:#0f0d0a; --grid:#2a251e; --line:#3d372e;
    --ink:#efe6d2; --muted:#a89f8c; --accent:#ff6b1a; --accent-press:#a3400a;
    --ok:#7ed957; --ok-shadow:#4a8f2c; --bad:#ff4d3d;
    --crate:#c8955a; --crate-shadow:#7a5530; --crate-ink:#2b1d0d; --cream-shadow:#8f8670;
    --display:'Chakra Petch', system-ui, sans-serif;
    --body:'IBM Plex Sans Thai', system-ui, sans-serif;
    --ease:cubic-bezier(.4,0,.2,1);
  }
  *, ::before, ::after { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--body); line-height:1.5; }
  h1, h2, p { margin:0; }
  button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; text-align:inherit; }
  button:disabled { cursor:default; }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .display { font-family:var(--display); }
  .muted { color:var(--muted); }
  .accent { color:var(--accent); }
  .nowrap { white-space:nowrap; }
  .fa-solid { line-height:1; }

  @keyframes shake { 20%,60% { transform:translateX(-7px) rotate(-2deg); } 40%,80% { transform:translateX(7px) rotate(2deg); } }
  @keyframes hop { 45% { transform:translateY(-22px) rotate(-4deg); } }
  @keyframes roll { to { background-position:32px 0; } }
  @keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
  @keyframes pulse { 50% { opacity:.5; } }
  .rise { animation:rise .5s ease both; }

  /* ---------- Global chrome ---------- */
  .page { min-height:100vh; background-color:var(--bg);
    background-image:linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:32px 32px; }
  .hazard { height:8px; background:repeating-linear-gradient(135deg, var(--accent) 0 14px, var(--bg) 14px 28px); }
  .wrap { max-width:1040px; margin:0 auto; padding:0 20px 56px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:20px 0; }
  .brand { display:flex; align-items:center; gap:12px; }
  .logo { width:40px; height:40px; display:grid; place-items:center; background:var(--accent); color:var(--bg);
    border-radius:4px; font-family:var(--display); font-weight:700; }
  .wordmark { font-family:var(--display); font-weight:700; font-size:14px; letter-spacing:.2em; }
  .head-btns { display:flex; gap:8px; }
  .chip-btn { height:44px; min-width:44px; padding:0 16px; display:inline-flex; align-items:center; justify-content:center; gap:6px;
    background:var(--panel); border:1px solid var(--line); border-radius:4px; font-size:14px; white-space:nowrap; transition:border-color .15s var(--ease); }
  .chip-btn.icon { padding:0; width:44px; }
  .chip-btn:hover { border-color:var(--accent); }

  .label { font-size:12px; line-height:16px; letter-spacing:.1em; color:var(--muted); }
  .tag { font-family:var(--display); font-size:12px; line-height:16px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }

  /* ---------- 1. Map ---------- */
  .map { display:grid; gap:40px; padding-top:24px; }
  .map-intro { display:flex; flex-direction:column; gap:24px; }
  .kicker { font-family:var(--display); color:var(--accent); font-size:14px; letter-spacing:.3em; }
  .hero { font-family:var(--display); font-weight:700; font-size:clamp(44px, 7vw, 84px); line-height:.95; text-transform:uppercase; }
  .lede { color:var(--muted); font-size:18px; line-height:1.625; max-width:38ch; text-wrap:pretty; }
  .tiles { display:flex; flex-wrap:wrap; align-items:stretch; gap:12px; }
  .tile { padding:12px 20px; background:var(--panel); border:1px solid var(--line); border-radius:4px; white-space:nowrap;
    text-align:left; transition:border-color .15s var(--ease); }
  .tile .big { font-family:var(--display); font-weight:700; font-size:30px; line-height:36px; }
  .tile .val { font-weight:600; }
  button.tile:hover { border-color:var(--accent); }
  button.tile.danger:hover { border-color:var(--bad); }
  .tile i { margin-left:4px; }

  .levels { position:relative; display:flex; flex-direction:column; gap:12px; }
  .levels::before { content:''; position:absolute; left:38px; top:16px; bottom:16px; width:3px;
    background:repeating-linear-gradient(var(--line) 0 8px, transparent 8px 14px); }
  .level { position:relative; display:flex; align-items:center; gap:20px; padding:12px 20px 12px 12px; text-align:left;
    background:var(--panel); border:1px solid var(--line); border-radius:4px; transition:all .15s var(--ease); }
  .level:enabled:hover { border-color:var(--accent); transform:translateX(4px); }
  .level:disabled { opacity:.4; cursor:not-allowed; }
  .num { position:relative; z-index:1; width:52px; height:52px; flex-shrink:0; display:grid; place-items:center; border-radius:4px;
    font-family:var(--display); font-weight:700; font-size:20px; background:var(--accent); color:var(--bg); }
  .num.done { background:var(--ok); }
  .num.locked { background:var(--grid); color:var(--muted); }
  .level-mid { flex:1; min-width:0; }
  .level-name { font-size:18px; line-height:28px; font-weight:600; }
  .level-right { white-space:nowrap; color:var(--accent); font-size:18px; letter-spacing:.1em; }

  /* ---------- 2. Play ---------- */
  .play { display:flex; flex-direction:column; gap:20px; padding-top:8px; }
  .play.rise { animation-duration:.4s; }
  .title-row { display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:16px; }
  .title-left { display:flex; align-items:flex-end; gap:16px; }
  .big-num { font-family:var(--display); font-weight:700; font-size:72px; line-height:.8; color:var(--accent); }
  .level-title { font-size:24px; line-height:32px; font-weight:600; }
  .stats { display:grid; grid-template-columns:repeat(4, auto); background:var(--panel); border:1px solid var(--line); border-radius:4px; }
  .stat { padding:8px 16px; min-width:84px; }
  .stat + .stat { border-left:1px solid var(--line); }
  .stat .k { white-space:nowrap; font-size:11px; line-height:16px; letter-spacing:.1em; color:var(--muted); }
  .stat .v { font-family:var(--display); font-weight:700; font-size:20px; line-height:28px; }
  .stat .v.hearts { font-family:var(--body); font-weight:400; color:var(--bad); letter-spacing:.1em; white-space:nowrap; }
  .stat .v.warn { color:var(--accent); }

  .stage { position:relative; overflow:hidden; border-radius:6px; border:1px solid var(--line); background:var(--stage);
    box-shadow:inset 0 0 80px #000; padding:48px 16px 0; }
  .glow { position:absolute; top:0; left:50%; transform:translateX(-50%); width:66.666%; height:96px;
    background:radial-gradient(ellipse at top, #ff6b1a33, transparent 70%); pointer-events:none; }
  .crates { position:relative; display:flex; justify-content:center; align-items:flex-end; gap:8px; }
  .slot { flex:1; max-width:96px; min-width:0; display:flex; flex-direction:column; align-items:stretch; gap:8px; }
  .crate { position:relative; height:92px; width:100%; overflow:hidden; border-radius:3px;
    font-family:var(--display); font-weight:700; font-size:36px; line-height:1; text-align:center;
    background:var(--crate); color:var(--crate-ink); box-shadow:0 6px 0 var(--crate-shadow);
    transition:all .15s var(--ease); }
  .crate:disabled { cursor:default; }
  .crate:enabled:hover { transform:translateY(-8px); }
  .crate.sorted { background:var(--ok); color:var(--bg); box-shadow:0 6px 0 var(--ok-shadow); }
  .crate.active { transform:translateY(-12px); outline:3px solid var(--accent); outline-offset:4px; }
  .crate.wrong { outline:3px solid var(--bad); outline-offset:4px; }
  .crate .seam { position:absolute; left:0; right:0; top:10px; height:1px; background:rgb(0 0 0 / .2); }
  .crate .tape { position:absolute; top:0; bottom:0; left:50%; width:12px; margin-left:-6px; background:rgb(0 0 0 / .1); }
  .crate .v { position:relative; }
  .hint-ring { box-shadow:0 0 0 4px var(--ink) !important; animation:pulse 2s cubic-bezier(.4,0,.6,1) infinite; }
  .crate.hint-ring { box-shadow:0 0 0 4px var(--ink), 0 6px 0 var(--crate-shadow) !important; }
  .bar { height:6px; border-radius:99px; background:var(--line); }
  .bar.sorted { background:var(--ok); }
  .bar.target { background:var(--accent); box-shadow:0 0 12px var(--accent); }
  .belt { position:relative; margin:4px -32px 0; height:20px; border-block:1px solid var(--line);
    background:repeating-linear-gradient(90deg, #3a342b 0 4px, #221e18 4px 32px); }
  .belt.rolling { animation:roll .8s linear infinite; }
  .stage-stripe { height:24px; margin:0 -32px; opacity:.6; background:repeating-linear-gradient(135deg, var(--accent) 0 10px, var(--stage) 10px 20px); }

  .controls { display:grid; gap:20px; }
  .ctl-left { display:flex; flex-direction:column; gap:16px; }
  .instruction { font-size:20px; line-height:28px; font-weight:600; text-wrap:pretty; }
  .choices { display:grid; gap:12px; }
  .choice { padding:16px; text-align:left; background:var(--panel); border:1px solid var(--line); border-radius:4px; transition:border-color .15s var(--ease); }
  .choice:hover { border-color:var(--accent); }
  .choice .t { font-family:var(--display); font-weight:700; font-size:18px; line-height:28px; }
  .choice .d { font-size:14px; line-height:20px; color:var(--muted); }
  .actions { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .act { height:56px; border-radius:4px; font-size:18px; font-weight:600; color:var(--bg); text-align:center; transition:all .15s var(--ease); }
  .act.swap { background:var(--accent); box-shadow:0 5px 0 var(--accent-press); }
  .act.keep { background:var(--ink); box-shadow:0 5px 0 var(--cream-shadow); }
  .act:enabled:active { transform:translateY(4px); box-shadow:none; }
  .act:disabled { opacity:.4; }
  .act.hint-ring.swap { box-shadow:0 0 0 4px var(--ink), 0 5px 0 var(--accent-press) !important; }
  .act.hint-ring.keep { box-shadow:0 0 0 4px var(--ink), 0 5px 0 var(--cream-shadow) !important; }
  .fb { padding:12px 16px; border-radius:4px; border-left:4px solid var(--accent); background:var(--panel); }
  .fb.ok { background:rgb(126 217 87 / .1); border-color:var(--ok); color:var(--ok); }
  .fb.err { background:rgb(255 77 61 / .1); border-color:var(--bad); color:var(--bad); }
  .secondary { display:flex; flex-wrap:wrap; gap:8px; font-size:14px; }
  .sec-btn { height:44px; padding:0 16px; white-space:nowrap; border:1px solid var(--line); border-radius:4px; transition:border-color .15s var(--ease); }
  .sec-btn:enabled:hover { border-color:var(--accent); }
  .sec-btn:disabled { opacity:.4; }
  .sec-btn i { margin-right:6px; }
  .log-card { padding:16px; background:var(--panel); border:1px solid var(--line); border-radius:4px; }
  .log-head { font-family:var(--display); font-size:12px; letter-spacing:.25em; color:var(--muted); margin-bottom:12px; }
  .log { max-height:190px; overflow:auto; display:flex; flex-direction:column; gap:6px; font-family:var(--display); font-size:14px; line-height:20px;
    scrollbar-color:var(--line) transparent; white-space:pre-wrap; }
  .log .bad { color:var(--bad); }

  /* ---------- 3. Summary ---------- */
  .summary { display:flex; flex-direction:column; gap:24px; padding-top:24px; }
  .summary.rise { animation-duration:.4s; }
  .report-title { font-family:var(--display); font-weight:700; font-size:48px; line-height:1; text-transform:uppercase; }
  .table-card { background:var(--panel); border:1px solid var(--line); border-radius:4px; overflow-x:auto; overflow-y:hidden; scrollbar-color:var(--line) transparent; }
  table { width:100%; border-collapse:collapse; text-align:left; }
  th { font-family:var(--display); font-weight:700; font-size:12px; line-height:16px; letter-spacing:.1em; color:var(--muted); }
  th, td { padding:12px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td { font-family:var(--display); }
  td.th-font { font-family:var(--body); }
  td.stars { color:var(--accent); letter-spacing:.1em; }
  .explain { display:grid; gap:20px; }
  .card { padding:20px; border-radius:4px; color:var(--bg); }
  .card.bubble { background:var(--ink); }
  .card.selection { background:var(--accent); }
  .card .t { font-family:var(--display); font-weight:700; font-size:20px; line-height:28px; margin-bottom:8px; }
  .card p { line-height:1.625; }

  /* ---------- 4. Modal ---------- */
  .overlay { position:fixed; inset:0; z-index:10; display:grid; place-items:center; padding:16px; background:rgb(0 0 0 / .75); backdrop-filter:blur(4px); }
  .modal { width:100%; max-width:440px; overflow:hidden; background:var(--ink); color:var(--bg); border-radius:6px; }
  .modal.rise { animation-duration:.3s; }
  .band { height:12px; }
  .band.win { background:repeating-linear-gradient(135deg, var(--ok) 0 12px, var(--bg) 12px 24px); }
  .band.fail { background:repeating-linear-gradient(135deg, var(--bad) 0 12px, var(--bg) 12px 24px); }
  .modal-body { display:flex; flex-direction:column; gap:16px; padding:24px; }
  .m-kicker { font-family:var(--display); font-size:12px; line-height:16px; letter-spacing:.3em; opacity:.6; }
  .m-title { font-family:var(--display); font-weight:700; font-size:36px; line-height:1; text-transform:uppercase; }
  .m-stars { font-size:48px; line-height:1; letter-spacing:.2em; color:var(--accent); }
  .m-text { line-height:1.625; }
  .m-btns { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding-top:4px; }
  .m-btn { height:48px; border-radius:4px; font-weight:600; text-align:center; transition:all .15s var(--ease); }
  .m-btn.m-sec { border:2px solid var(--bg); }
  .m-btn.m-sec:hover { background:var(--bg); color:var(--ink); }
  .m-btn.m-pri { background:var(--bg); color:var(--ink); }
  .m-btn.m-pri:hover { background:var(--accent); color:var(--bg); }

  /* ---------- Responsive ---------- */
  @media (min-width:640px) {
    .stage { padding-inline:32px; }
    .crates { gap:12px; }
    .choices, .explain { grid-template-columns:1fr 1fr; }
  }
  @media (min-width:768px) {
    .map { grid-template-columns:1fr 1.25fr; }
    .controls { grid-template-columns:1.4fr 1fr; }
  }
  @media (max-width:420px) {
    .stat { min-width:0; padding:8px 10px; }
    .crate { font-size:28px; }
  }
  @media (prefers-reduced-motion:reduce) {
    *, ::before, ::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ================== ข้อมูลด่าน ================== */
const LEVELS = [
  { id: 1, name: 'สายพานฝึกหัด', algo: 'bubble', arr: [3, 1, 4, 2] },
  { id: 2, name: 'สายพาน 6 กล่อง', algo: 'bubble', arr: [5, 2, 6, 1, 4, 3] },
  { id: 3, name: 'หาตัวเล็กที่สุด', algo: 'selection', arr: [4, 2, 5, 1, 3] },
  { id: 4, name: 'กะดึก 6 กล่อง', algo: 'selection', arr: [6, 3, 5, 1, 4, 2] },
  { id: 5, name: 'โควตาสลับจำกัด', algo: null, arr: [7, 6, 5, 1, 4, 3, 2], quota: 6 }, // Bubble ต้องสลับ 18 ครั้ง → ไม่ผ่าน
];
const NAME = { bubble: 'Bubble Sort', selection: 'Selection Sort' };
const KEY = 'sorting-factory-progress-v1';
const LIVES = 3;
const UNLOCK_ALL = new URLSearchParams(location.search).has('unlockAll');

const stars = k => '★'.repeat(k) + '☆'.repeat(3 - k);
const pad = n => String(n).padStart(2, '0');
const minIdx = (a, from) => a.reduce((m, v, x) => x >= from && v < a[m] ? x : m, from);

/* ================== สถานะ ================== */
const S = { screen: 'map', progress: loadProgress(), muted: false, g: null, modal: null };
let winTimer = 0, ac;

function loadProgress() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } }
function saveProgress() { try { localStorage.setItem(KEY, JSON.stringify(S.progress)); } catch {} }

/* ================== เสียง ================== */
function beep(f, d = 0.15) {
  if (S.muted) return;
  try {
    ac ||= new AudioContext();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'square'; o.frequency.value = f; g.gain.value = 0.05;
    g.gain.exponentialRampToValueAtTime(1e-4, ac.currentTime + d);
    o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
  } catch {}
}

/* ================== ตรรกะเกม ================== */
function start(id) {
  clearTimeout(winTimer);
  const lv = LEVELS[id - 1];
  S.screen = 'play'; S.modal = null;
  S.g = { lv, algo: lv.algo, a: [...lv.arr], done: 0, pass: 0, j: 0, swapped: false,
    lives: LIVES, score: 0, swaps: 0, comps: 0, log: [], fx: '', fxN: 0, over: false,
    fb: { t: 'info', s: lv.algo ? 'เรียงกล่องจากน้อยไปมาก' : `โควตาสลับ ${lv.quota} ครั้ง — เลือก Algorithm ที่สลับน้อยกว่า` } };
  render();
}

function goMap() { clearTimeout(winTimer); S.screen = 'map'; S.g = null; S.modal = null; render(); }
function goSummary() { clearTimeout(winTimer); S.screen = 'summary'; S.g = null; S.modal = null; render(); }

// บันทึกผลของการกระทำหนึ่งครั้ง แล้วตรวจว่ากะนี้ล้มเหลวหรือยัง
function step(g, ok, s, fx = '') {
  g.fx = fx; g.fxN++; g.fb = { t: ok ? 'ok' : 'err', s }; g.log.unshift({ ok, s });
  beep(ok ? 660 : 140, ok ? 0.15 : 0.3);
  if (!ok && --g.lives <= 0) { g.over = true; end(false, 'หัวใจหมดแล้ว — ลองใช้คำใบ้เมื่อไม่แน่ใจ'); }
  else if (g.lv.quota && g.swaps > g.lv.quota) { g.over = true; end(false, `สลับเกินโควตา ${g.lv.quota} ครั้ง — Selection Sort สลับไม่เกิน 1 ครั้งต่อรอบ`); }
}

// Bubble Sort: ผู้เล่นตอบว่าคู่ a[j], a[j+1] ต้องสลับหรือไม่
function bubble(swap) {
  const g = S.g;
  if (!g || g.over || g.algo !== 'bubble') return;
  const { a, j } = g, n = a.length, need = a[j] > a[j + 1];
  if (swap !== need) {
    step(g, false, `ผิด! ${a[j]} ${need ? 'มากกว่า' : 'น้อยกว่า'} ${a[j + 1]} — สลับเมื่อซ้ายมากกว่าขวาเท่านั้น`, `shake-${j}`);
    return render();
  }
  const msg = `${a[j]} ${need ? '> ' + a[j + 1] + ' → สลับ' : '< ' + a[j + 1] + ' → ไม่ต้องสลับ'}`;
  if (swap) { [a[j], a[j + 1]] = [a[j + 1], a[j]]; g.swaps++; g.swapped = true; }
  g.comps++; g.score += 10; g.j++;
  if (g.j >= n - 1 - g.pass) {                     // จบรอบ: กล่องท้ายสุดของรอบนี้เข้าที่แล้ว
    g.done = g.pass + 1;
    if (!g.swapped || g.pass + 1 >= n - 1) g.done = n; // รอบที่ไม่มีการสลับ หรือรอบสุดท้าย = เรียงเสร็จ
    else { g.pass++; g.j = 0; g.swapped = false; }
  }
  step(g, true, 'ถูก! ' + msg);
  if (g.done === n && !g.over) win(g);
  render();
}

// Selection Sort: ผู้เล่นคลิกกล่องที่เล็กที่สุดในส่วนที่ยังไม่เรียง
function select(k) {
  const g = S.g;
  if (!g || g.over || g.algo !== 'selection' || k < g.done || k >= g.a.length) return;
  const { a, done } = g, m = minIdx(a, done);
  if (k !== m) { step(g, false, `ผิด! ${a[m]} เล็กกว่า ${a[k]}`, `shake-${k}`); return render(); }
  const v = a[m];
  if (m !== done) { [a[done], a[m]] = [a[m], a[done]]; g.swaps++; }
  g.comps += a.length - 1 - done; g.score += 10; g.done++;
  if (g.done >= a.length - 1) g.done = a.length;    // เหลือกล่องเดียว = อยู่ถูกที่แล้ว
  step(g, true, `ถูก! ${v} เล็กที่สุด → วางช่อง ${done + 1}`);
  if (g.done === a.length && !g.over) win(g);
  render();
}

function hint() {
  const g = S.g;
  if (!g || g.over || !g.algo) return;
  g.score = Math.max(0, g.score - 3);
  g.fx = g.algo === 'bubble' ? (g.a[g.j] > g.a[g.j + 1] ? 'hint-swap' : 'hint-keep') : `hint-${minIdx(g.a, g.done)}`;
  g.fb = { t: 'info', s: 'คำใบ้ (−3 คะแนน): ดูสิ่งที่ไฮไลต์' };
  render();
}

function chooseAlgo(algo) { if (S.g && !S.g.algo) { S.g.algo = algo; render(); } }

function win(g) {
  g.over = true; g.fx = 'win'; g.fxN++;
  const mistakes = LIVES - g.lives, s = Math.max(1, 3 - mistakes), prev = S.progress[g.lv.id];
  S.progress = { ...S.progress, [g.lv.id]: { stars: Math.max(s, prev?.stars || 0), algo: g.algo, swaps: g.swaps, comps: g.comps, mistakes } };
  saveProgress();
  [523, 659, 784].forEach((f, i) => setTimeout(() => beep(f), i * 110));
  winTimer = setTimeout(() => end(true, `${g.score} คะแนน · เปรียบเทียบ ${g.comps} · สลับ ${g.swaps} · ผิด ${mistakes}`, s), 900);
}

function end(win, text, s = 0) { S.modal = { win, text, s, id: S.g.lv.id }; if (win) render(); }

function resetAll() {
  if (confirm('ล้างดาวและความคืบหน้าทั้งหมด แล้วเริ่มด่าน 1 ใหม่?')) {
    try { localStorage.removeItem(KEY); } catch {}
    S.progress = {}; render();
  }
}

/* ================== หน้าจอ ================== */
let lastScreen = null, lastModal = null, lastFxN = -1;

function header() {
  return `<header>
    <div class="brand"><div class="logo">SF</div><div class="wordmark">SORTING FACTORY</div></div>
    <div class="head-btns">
      ${S.screen !== 'map' ? `<button class="chip-btn" data-act="map"><i class="fa-solid fa-map"></i>แผนที่</button>` : ''}
      <button class="chip-btn icon" data-act="mute" aria-label="เสียง" aria-pressed="${S.muted}"><i class="fa-solid ${S.muted ? 'fa-volume-xmark' : 'fa-volume-high'}"></i></button>
    </div>
  </header>`;
}

function mapScreen(rise) {
  const p = S.progress, total = LEVELS.reduce((t, l) => t + (p[l.id]?.stars || 0), 0);
  const rows = LEVELS.map((l, i) => {
    const locked = !(UNLOCK_ALL || i === 0 || p[i]), done = !!p[l.id];
    return `<button class="level" data-act="start:${l.id}" ${locked ? 'disabled' : ''}>
      <div class="num ${done ? 'done' : locked ? 'locked' : ''}">${pad(l.id)}</div>
      <div class="level-mid"><div class="tag">${l.algo ? NAME[l.algo] : 'เลือก Algorithm เอง'}</div><div class="level-name">${l.name}</div></div>
      <div class="level-right">${locked ? '' : done ? stars(p[l.id].stars) : '▶'}</div>
    </button>`;
  }).join('');
  return `<div class="map ${rise}">
    <div class="map-intro">
      <div class="kicker">กะกลางคืน · NIGHT SHIFT</div>
      <h1 class="hero">Sort<br>the<br><span class="accent">line.</span></h1>
      <p class="lede">กล่องลังไหลมาบนสายพานแบบสลับมั่ว เรียงจากน้อยไปมากตามกฎของเครื่องจักร ก่อนรถส่งของจะมาถึง</p>
      <div class="tiles">
        <div class="tile"><div class="label">ดาวสะสม</div><div class="big">${total}/15</div></div>
        <button class="tile" data-act="summary"><div class="label">รายงาน</div><div class="val">สรุปผล <i class="fa-solid fa-arrow-right accent"></i></div></button>
        <button class="tile danger" data-act="reset"><div class="label">ล้างความคืบหน้า</div><div class="val">เริ่มใหม่แต่ต้น <i class="fa-solid fa-rotate-left" style="color:var(--bad)"></i></div></button>
      </div>
    </div>
    <div class="levels">${rows}</div>
  </div>`;
}

function playScreen(rise) {
  const g = S.g, n = g.a.length, fresh = g.fxN !== lastFxN;
  const hearts = '♥'.repeat(g.lives) + '♡'.repeat(Math.max(0, LIVES - g.lives));
  const quotaWarn = g.lv.quota && g.swaps >= g.lv.quota - 1;

  const crates = g.a.map((v, k) => {
    const sorted = g.done === n || (g.algo === 'bubble' ? k >= n - g.done : k < g.done);
    const active = !g.over && g.algo === 'bubble' && (k === g.j || k === g.j + 1);
    const target = !g.over && g.algo === 'selection' && k === g.done;
    const shake = g.fx === `shake-${k}`;
    const anim = fresh && shake ? 'shake .4s' : fresh && g.fx === 'win' ? `hop .55s ${k * 80}ms` : 'none';
    const locked = g.algo !== 'selection' || g.over || sorted;
    const cls = ['crate', sorted && 'sorted', active && 'active', shake && 'wrong', g.fx === `hint-${k}` && 'hint-ring'].filter(Boolean).join(' ');
    return `<div class="slot" style="animation:${anim}">
      <button class="${cls}" data-act="pick:${k}" ${locked ? 'disabled' : ''} aria-label="กล่อง ${v}">
        <span class="seam"></span><span class="tape"></span><span class="v">${v}</span>
      </button>
      <div class="bar ${target ? 'target' : sorted ? 'sorted' : ''}"></div>
    </div>`;
  }).join('');

  const instruction = !g.algo ? 'เลือก Algorithm สำหรับด่านนี้' : g.over ? 'กะนี้จบแล้ว' : g.algo === 'bubble'
    ? `รอบที่ ${g.pass + 1} — ${g.a[g.j]} มากกว่า ${g.a[g.j + 1]} ไหม?` : `คลิกกล่องที่เล็กที่สุด เพื่อวางที่ช่อง ${g.done + 1}`;

  const dis = g.over ? 'disabled' : '';
  const log = g.log.map((l, i) => `<div class="${l.ok ? '' : 'bad'}">${pad(g.log.length - i)}  ${l.s}</div>`).join('');

  return `<div class="play ${rise}">
    <div class="title-row">
      <div class="title-left">
        <div class="big-num">${pad(g.lv.id)}</div>
        <div><div class="tag">${NAME[g.algo] || 'เลือก Algorithm'}</div><div class="level-title">${g.lv.name}</div></div>
      </div>
      <div class="stats">
        <div class="stat"><div class="k">หัวใจ</div><div class="v hearts" aria-label="หัวใจ ${g.lives}">${hearts}</div></div>
        <div class="stat"><div class="k">คะแนน</div><div class="v">${g.score}</div></div>
        <div class="stat"><div class="k">สลับ</div><div class="v ${quotaWarn ? 'warn' : ''}">${g.lv.quota ? `${g.swaps}/${g.lv.quota}` : g.swaps}</div></div>
        <div class="stat"><div class="k">เปรียบเทียบ</div><div class="v">${g.comps}</div></div>
      </div>
    </div>

    <div class="stage">
      <div class="glow"></div>
      <div class="crates">${crates}</div>
      <div class="belt ${g.over ? '' : 'rolling'}"></div>
      <div class="stage-stripe"></div>
    </div>

    <div class="controls">
      <div class="ctl-left">
        <div class="instruction">${instruction}</div>
        ${!g.algo ? `<div class="choices">
          <button class="choice" data-act="choose:bubble"><div class="t">BUBBLE SORT</div><div class="d">เทียบคู่ติดกัน สลับทีละคู่จนตัวใหญ่ไหลไปท้ายสายพาน</div></button>
          <button class="choice" data-act="choose:selection"><div class="t">SELECTION SORT</div><div class="d">หาตัวเล็กที่สุดในส่วนที่เหลือ แล้วสลับไปช่องเป้าหมาย</div></button>
        </div>` : ''}
        ${g.algo === 'bubble' ? `<div class="actions">
          <button class="act swap ${g.fx === 'hint-swap' ? 'hint-ring' : ''}" data-act="swap" ${dis}>สลับ</button>
          <button class="act keep ${g.fx === 'hint-keep' ? 'hint-ring' : ''}" data-act="keep" ${dis}>ไม่ต้องสลับ</button>
        </div>` : ''}
        <div class="fb ${g.fb.t}" aria-live="polite">${g.fb.s}</div>
        <div class="secondary">
          <button class="sec-btn" data-act="hint" ${dis}><i class="fa-solid fa-lightbulb accent"></i>คำใบ้ −3</button>
          <button class="sec-btn" data-act="restart"><i class="fa-solid fa-rotate-right"></i>เริ่มใหม่</button>
        </div>
      </div>
      <div class="log-card">
        <div class="log-head">LOG · บันทึกขั้นตอน</div>
        <div class="log">${log}</div>
      </div>
    </div>
  </div>`;
}

function summaryScreen(rise) {
  const p = S.progress;
  const rows = LEVELS.map(l => {
    const r = p[l.id];
    return `<tr><td class="th-font">${pad(l.id)} ${l.name}</td><td>${NAME[r?.algo] || '–'}</td><td class="stars">${stars(r?.stars || 0)}</td>
      <td>${r?.comps ?? '–'}</td><td>${r?.swaps ?? '–'}</td><td>${r?.mistakes ?? '–'}</td></tr>`;
  }).join('');
  return `<div class="summary ${rise}">
    <h2 class="report-title">Shift <span class="accent">report</span></h2>
    <div class="table-card"><table>
      <thead><tr><th>ด่าน</th><th>ALGORITHM</th><th>ดาว</th><th>เปรียบเทียบ</th><th>สลับ</th><th>ผิด</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div class="explain">
      <div class="card bubble"><div class="t">BUBBLE SORT</div><p>เทียบเฉพาะคู่ติดกัน สลับทุกครั้งที่ซ้ายมากกว่าขวา จำนวนการสลับเท่ากับจำนวนคู่ที่ผิดลำดับ ถ้าสายพานเกือบเรียงแล้วจะจบเร็ว</p></div>
      <div class="card selection"><div class="t">SELECTION SORT</div><p>ไล่ดูทุกกล่องที่เหลือทุกรอบ จึงเปรียบเทียบเยอะเสมอ แต่สลับไม่เกิน 1 ครั้งต่อรอบ เหมาะเมื่อการย้ายกล่องมีต้นทุนสูง</p></div>
    </div>
  </div>`;
}

function modalView(rise) {
  const m = S.modal;
  return `<div class="overlay">
    <div class="modal ${rise}" role="dialog" aria-modal="true" aria-labelledby="mTitle">
      <div class="band ${m.win ? 'win' : 'fail'}"></div>
      <div class="modal-body">
        <div class="m-kicker">ด่าน ${pad(m.id)} · ${m.win ? 'ผ่าน' : 'ไม่ผ่าน'}</div>
        <div class="m-title" id="mTitle">${m.win ? 'Shift complete' : 'Line stopped'}</div>
        ${m.win ? `<div class="m-stars" aria-label="${m.s} ดาว">${stars(m.s)}</div>` : ''}
        <div class="m-text">${m.text}</div>
        <div class="m-btns">
          <button class="m-btn m-sec" data-act="m2">${m.win ? 'ลองใหม่' : 'แผนที่'}</button>
          <button class="m-btn m-pri" data-act="m1">${m.win ? (m.id === 5 ? 'ดูสรุปผล' : 'ด่านถัดไป →') : 'ลองใหม่'}</button>
        </div>
      </div>
    </div>
  </div>`;
}

function render() {
  const focusKey = document.activeElement?.dataset?.act;
  const screenRise = S.screen !== lastScreen ? 'rise' : '';
  const modalOpened = S.modal && S.modal !== lastModal;
  const body = S.screen === 'map' ? mapScreen(screenRise) : S.screen === 'play' ? playScreen(screenRise) : summaryScreen(screenRise);

  document.getElementById('app').innerHTML = `<div class="page">
    <div class="hazard"></div>
    <div class="wrap">${header()}${body}</div>
    ${S.modal ? modalView(modalOpened ? 'rise' : '') : ''}
  </div>`;

  if (screenRise) scrollTo(0, 0);
  lastScreen = S.screen; lastModal = S.modal; lastFxN = S.g?.fxN ?? -1;

  // คงโฟกัสคีย์บอร์ดไว้ที่ปุ่มเดิมหลังวาดใหม่ / ย้ายโฟกัสเข้า modal เมื่อเปิด
  const target = modalOpened ? document.querySelector('[data-act="m1"]') : focusKey && document.querySelector(`[data-act="${focusKey}"]:not(:disabled)`);
  target?.focus();
}

/* ================== อินพุต ================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const [act, arg] = el.dataset.act.split(':'), m = S.modal;
  ({
    map: goMap, summary: goSummary, reset: resetAll,
    mute: () => { S.muted = !S.muted; render(); },
    start: () => start(+arg), pick: () => select(+arg), choose: () => chooseAlgo(arg),
    swap: () => bubble(true), keep: () => bubble(false), hint, restart: () => start(S.g.lv.id),
    m1: () => m.win ? (m.id === 5 ? goSummary() : start(m.id + 1)) : start(m.id),
    m2: () => m.win ? start(m.id) : goMap(),
  })[act]?.();
});

render();
</script>
</body>
</html>
